<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post | Rohan Giriraj</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
    <link rel="apple-touch-icon" href="assets/icons/favicon.svg">

    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Markdown, Syntax Highlighting, and LaTeX Support -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
    <script>
        // MathJax's default config only recognizes \( \) for inline math;
        // our content uses $ $ too, so it must be declared before the
        // tex-mml-chtml bundle below loads.
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="assets/js/transitions.js" defer></script>
</head>
<body>

    <div class="glow"></div>

    <!-- Navigation Dock -->
        <div class="nav-container">
        <nav>
            <a href="index.html" class="nav-item">Home</a>
            <a href="projects.html" class="nav-item">Work</a>
            <a href="blog.html" class="nav-item active">Thoughts</a>
        </nav>
    </div>

        <div class="wrapper">
        <a href="#" class="back-link" id="backLink">← Back to Thoughts</a>
        
        <article class="post-content">
            <div class="post-header">
                <h1 id="postTitle"></h1>
                <div class="post-meta">
                    <span id="postDate"></span>
                    <span id="postReadTime" class="read-time"></span>
                </div>
            </div>
            <div id="postBody"></div>
        </article>
    </div>

        <script>
        // Configure marked options
        marked.setOptions({
            breaks: true,
            gfm: true
        });

        // Get URL parameters
        const params = new URLSearchParams(window.location.search);
        const postFile = params.get('post');
        const fromPage = params.get('from');

        // Set up back link intelligently
        const backLink = document.getElementById('backLink');
        if (fromPage) {
            // User came from a paginated view
            backLink.href = `blog.html?view=all&page=${fromPage}`;
            if (fromPage !== '1') {
                backLink.textContent = `← Back to Thoughts (Page ${fromPage})`;
            }
        } else {
            // User came from featured view or direct link
            backLink.href = 'blog.html';
        }

        async function loadPost() {
            if (!postFile){
                document.getElementById('postTitle').textContent = 'Post Not Found';
                document.getElementById('postBody').innerHTML = '<p>No post specified.</p>';
                return;
            }

            try {
                // Load posts metadata
                const postsResponse = await fetch('posts.json');
                const posts = await postsResponse.json();
                
                // Find the post metadata
                const post = posts.find(p => p.file === postFile);
                
                if (!post) {
                    document.getElementById('postTitle').textContent = 'Post Not Found';
                    document.getElementById('postBody').innerHTML = '<p>Could not find this post.</p>';
                    return;
                }

                // Update page title and post metadata
                document.title = `${post.title} | Rohan Giriraj`;
                document.getElementById('postTitle').textContent = post.title;
                
                // Format date
                const date = new Date(post.date);
                const formattedDate = date.toLocaleDateString('en-US', { 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric' 
                });
                document.getElementById('postDate').textContent = formattedDate;

                // Load and render markdown content
                // Add .md extension if not present
                const fileName = postFile.endsWith('.md') ? postFile : `${postFile}.md`;
                const contentResponse = await fetch(`content/posts/${fileName}`);
                const markdown = await contentResponse.text();
                
                // marked.js would otherwise mangle raw LaTeX before MathJax
                // sees it — e.g. collapsing the \\ matrix-row separator in
                // \begin{pmatrix}...\\...\end{pmatrix} into a single \.
                // Swap math segments for placeholders, let marked run, then
                // restore the untouched LaTeX into the resulting HTML.
                const mathSegments = [];
                const stash = (match) => {
                    mathSegments.push(match);
                    return `@@MATH${mathSegments.length - 1}@@`;
                };
                const protectedMarkdown = markdown
                    .replace(/\$\$[\s\S]+?\$\$/g, stash)
                    .replace(/\\\[[\s\S]+?\\\]/g, stash)
                    .replace(/\\\([\s\S]+?\\\)/g, stash)
                    .replace(/\$[^$\n]+?\$/g, stash);

                // Convert markdown to HTML
                let html = marked.parse(protectedMarkdown);
                html = html.replace(/@@MATH(\d+)@@/g, (_, i) => mathSegments[Number(i)]);
                document.getElementById('postBody').innerHTML = html;

                // Estimate reading time from the raw word count (~200 wpm)
                const wordCount = markdown.trim().split(/\s+/).length;
                const minutes = Math.max(1, Math.round(wordCount / 200));
                document.getElementById('postReadTime').textContent = `${minutes} min read`;

                // Apply syntax highlighting
                Prism.highlightAll();

                // Trigger MathJax rendering. The script tag is async, so it
                // can still be loading when we get here even though
                // window.MathJax already exists (we predefine it for config
                // above) — wait for its startup promise, or for the script
                // itself to finish loading if startup isn't ready yet.
                const typesetMath = () => {
                    const target = document.getElementById('postBody');
                    if (window.MathJax && window.MathJax.startup && window.MathJax.startup.promise) {
                        window.MathJax.startup.promise
                            .then(() => window.MathJax.typesetPromise([target]))
                            .catch((err) => console.log('MathJax error:', err));
                    } else {
                        document.getElementById('MathJax-script').addEventListener('load', typesetMath, { once: true });
                    }
                };
                typesetMath();

            } catch (error) {
                console.error('Error loading post:', error);
                document.getElementById('postTitle').textContent = 'Error Loading Post';
                document.getElementById('postBody').innerHTML = '<p>Failed to load post content.</p>';
            }
        }

        // Load post on page load
        loadPost();
    </script>
</body>
</html>
